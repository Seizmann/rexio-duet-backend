[package]
name = "duet-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.44.0", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
redis = { version = "0.29.1", features = ["tokio-comp", "json"] }
jsonwebtoken = "9.3.1"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
# ChaCha20-Poly1305 over AES-GCM: the VPS has no guaranteed AES-NI, where software
# AES is slower and cache-timing prone. ChaCha20 is constant-time in pure software.
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
hmac = "0.12.1"
sha2 = "0.10.8"
base64 = "0.22.1"
rand = "0.9.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Integration tests live in `test/` (not Cargo's default `tests/`) per TEST.md, so
# the target has to be declared explicitly.
[[test]]
name = "backend_test"
path = "test/backend_test.rs"
